<canvas id="heart"></canvas>

<script>
    window.requestAnimationFrame =
            window.__requestAnimationFrame ||
            window.requestAnimationFrame ||
            window.webkitRequestAnimationFrame ||
            window.mozRequestAnimationFrame ||
            window.oRequestAnimationFrame ||
            window.msRequestAnimationFrame ||
            (function () {
                return function (callback, element) {
                    var lastTime = element.__lastTime;
                    if (lastTime === undefined) {
                        lastTime = 0;
                    }
                    var currTime = Date.now();
                    var timeToCall = Math.max(1, 33 - (currTime - lastTime));
                    window.setTimeout(callback, timeToCall);
                    element.__lastTime = currTime + timeToCall;
                };
            })();
    window.isDevice = (/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(((navigator.userAgent || navigator.vendor || window.opera)).toLowerCase()));
    var loaded = false;
    var init = function () {
        if (loaded) return;
        loaded = true;
        var mobile = window.isDevice;
        var koef = mobile ? 0.5 : 1;
        var canvas = document.getElementById('heart');
        var ctx = canvas.getContext('2d');
        var width = canvas.width = koef * innerWidth;
        var height = canvas.height = koef * innerHeight;
        var rand = Math.random;
        ctx.fillStyle = "rgba(0,0,0,1)";
        ctx.fillRect(0, 0, width, height);


        var heartPosition = function (rad) {
            //return [Math.sin(rad), Math.cos(rad)];
            return [Math.pow(Math.sin(rad), 3), -(15 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 * rad) - Math.cos(4 * rad))];
        };
        var scaleAndTranslate = function (pos, sx, sy, dx, dy) {
            return [dx + pos[0] * sx, dy + pos[1] * sy];
        };

        window.addEventListener('resize', function () {
            width = canvas.width = koef * innerWidth;
            height = canvas.height = koef * innerHeight;
            ctx.fillStyle = "rgba(0,0,0,1)";
            ctx.fillRect(0, 0, width, height);
        });

        var traceCount = mobile ? 20 : 50;
        var pointsOrigin = [];
        var i;
        var dr = mobile ? 0.3 : 0.1;
        for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 210, 13, 0, 0));
        for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 150, 9, 0, 0));
        for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 90, 5, 0, 0));
        var heartPointsCount = pointsOrigin.length;

        var targetPoints = [];
        var pulse = function (kx, ky) {
            for (i = 0; i < pointsOrigin.length; i++) {
                targetPoints[i] = [];
                targetPoints[i][0] = kx * pointsOrigin[i][0] + width / 2;
                targetPoints[i][1] = ky * pointsOrigin[i][1] + height / 2;
            }
        };

        var e = [];
        for (i = 0; i < heartPointsCount; i++) {
            var x = rand() * width;
            var y = rand() * height;
            e[i] = {
                vx: 0,
                vy: 0,
                R: 2,
                speed: rand() + 5,
                q: ~~(rand() * heartPointsCount),
                D: 2 * (i % 2) - 1,
                force: 0.2 * rand() + 0.7,
                f: "hsla(0," + ~~(40 * rand() + 60) + "%," + ~~(60 * rand() + 20) + "%,.3)",
                trace: []
            };
            for (var k = 0; k < traceCount; k++) e[i].trace[k] = {x: x, y: y};
        }

        var config = {
            traceK: 0.4,
            timeDelta: 0.01
        };

        var time = 0;
        var textLeft1 = 0;
        var textLeft2 = -10;
        var loop = function () {
            var mLeft = 50;
            var mTop = 250;
            var n = -Math.cos(time);
            pulse((1 + n) * .5, (1 + n) * .5);
            time += ((Math.sin(time)) < 0 ? 9 : (n > 0.8) ? .2 : 1) * config.timeDelta;
            ctx.fillStyle = "rgba(0,0,0,.1)";
            ctx.fillRect(0, 0, width, height);
            for (i = e.length; i--;) {
                var u = e[i];
                var q = targetPoints[u.q];
                var dx = u.trace[0].x - q[0];
                var dy = u.trace[0].y - q[1];
                var length = Math.sqrt(dx * dx + dy * dy);
                if (10 > length) {
                    if (0.95 < rand()) {
                        u.q = ~~(rand() * heartPointsCount);
                    }
                    else {
                        if (0.99 < rand()) {
                            u.D *= -1;
                        }
                        u.q += u.D;
                        u.q %= heartPointsCount;
                        if (0 > u.q) {
                            u.q += heartPointsCount;
                        }
                    }
                }
                u.vx += -dx / length * u.speed;
                u.vy += -dy / length * u.speed;
                u.trace[0].x += u.vx;
                u.trace[0].y += u.vy;
                u.vx *= u.force;
                u.vy *= u.force;
                for (k = 0; k < u.trace.length - 1;) {
                    var T = u.trace[k];
                    var N = u.trace[++k];
                    N.x -= config.traceK * (N.x - T.x);
                    N.y -= config.traceK * (N.y - T.y);
                }
                ctx.fillStyle = u.f;
                for (k = 0; k < u.trace.length; k++) {
                    ctx.fillRect(u.trace[k].x, u.trace[k].y, 1, 1);
                }
            }
            //ctx.fillStyle = "rgba(255,255,255,1)";
            //for (i = u.trace.length; i--;) ctx.fillRect(targetPoints[i][0], targetPoints[i][1], 2, 2);

            window.requestAnimationFrame(loop, canvas);
        };

        loop();
    };

    var s = document.readyState;
    if (s === 'complete' || s === 'loaded' || s === 'interactive') init();
    else document.addEventListener('DOMContentLoaded', init, false);
</script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const overlayImg = document.getElementById('overlay-img');
        const overlay = document.getElementById('overlay');
        
        // Cache viewport dimensions for better performance
        let viewportWidth = window.innerWidth;
        let viewportHeight = window.innerHeight;
        let imgWidth = 0;
        let imgHeight = 0;
        
        // Update viewport on resize
        window.addEventListener('resize', function() {
            viewportWidth = window.innerWidth;
            viewportHeight = window.innerHeight;
        });
        
        overlayImg.onload = function() {
            // Get actual rendered dimensions
            imgWidth = overlayImg.getBoundingClientRect().width;
            imgHeight = overlayImg.getBoundingClientRect().height;
            startDVDAnimation();
        };
        
        if (overlayImg.complete) {
            // For cached images
            setTimeout(function() {
                imgWidth = overlayImg.getBoundingClientRect().width;
                imgHeight = overlayImg.getBoundingClientRect().height;
                startDVDAnimation();
            }, 10);
        }
        
        function startDVDAnimation() {
            // Calculate valid boundaries (image must stay within viewport)
            const maxX = Math.max(0, viewportWidth - imgWidth);
            const maxY = Math.max(0, viewportHeight - imgHeight);
            
            // Initialize position with safe boundaries
            let xPos = Math.random() * maxX;
            let yPos = Math.random() * maxY;
            
            // Velocity: ±2 to ±4 pixels per frame
            let xSpeed = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);
            let ySpeed = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);

            function moveImage() {
                // Recalculate boundaries (in case window resized)
                const boundaries = {
                    minX: 0,
                    maxX: Math.max(0, viewportWidth - imgWidth),
                    minY: 0,
                    maxY: Math.max(0, viewportHeight - imgHeight)
                };
                
                // Update position
                xPos += xSpeed;
                yPos += ySpeed;

                // Horizontal boundary check and bounce
                if (xPos <= boundaries.minX) {
                    xPos = boundaries.minX;
                    xSpeed = Math.abs(xSpeed); // Bounce right
                } else if (xPos >= boundaries.maxX) {
                    xPos = boundaries.maxX;
                    xSpeed = -Math.abs(xSpeed); // Bounce left
                }

                // Vertical boundary check and bounce
                if (yPos <= boundaries.minY) {
                    yPos = boundaries.minY;
                    ySpeed = Math.abs(ySpeed); // Bounce down
                } else if (yPos >= boundaries.maxY) {
                    yPos = boundaries.maxY;
                    ySpeed = -Math.abs(ySpeed); // Bounce up
                }

                // Apply new position
                overlayImg.style.left = xPos + 'px';
                overlayImg.style.top = yPos + 'px';
                overlayImg.style.margin = '0';
                overlay.style.pointerEvents = 'none';

                requestAnimationFrame(moveImage);
            }

            moveImage();
        }
    });
</script>

  <script>
  (function(){
    var pages = ['index.html','index2.html','index3.html','index4.html']; // order of pages

    var overlay = document.getElementById('overlay');
    var img = document.getElementById('overlay-img');
    var txt = document.getElementById('overlay-text');
    var nextBtn = document.getElementById('nextBtn');

    // determine current file name
    var currentFile = location.pathname.split('/').pop() || 'index4.html';
    var idx = pages.indexOf(currentFile);
    if (idx === -1) idx = 3;
    var nextPage = pages[(idx + 1) % pages.length];

    // allow per-page customization via data attributes on <body>
    var imgSrc = document.body.dataset.overlayImg || img.src;
    var overlayText = document.body.dataset.overlayText || txt.textContent;

    img.src = imgSrc;
    txt.textContent = overlayText;

    // Button click handler
    nextBtn.addEventListener('click', function() {
      overlay.classList.add('hidden');
      setTimeout(function(){
        window.location.href = nextPage;
      }, 1000);
    });
  })();
  </script>
