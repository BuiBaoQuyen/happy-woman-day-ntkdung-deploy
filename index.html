  <canvas id="pinkboard"></canvas>
  <div id="overlay" class="fade">
    <img id="overlay-img" src="image/love1.jpg" alt="">
    <div class="overlay-text" id="overlay-text">Chúc bạn Dung 8/3 vui vẻ</div>
  </div>

  <button id="nextBtn">Tiếp tục →</button>
  <script>
  /*
 * Settings
 */
var settings = {
  particles: {
    length:   500, // maximum amount of particles
    duration:   2, // particle duration in sec
    velocity: 100, // particle velocity in pixels/sec
    effect: -0.75, // play with this for a nice effect
    size:      30, // particle size in pixels
  },
};

/*
 * RequestAnimationFrame polyfill by Erik Möller
 */
(function(){var b=0;var c=["ms","moz","webkit","o"];for(var a=0;a<c.length&&!window.requestAnimationFrame;++a){window.requestAnimationFrame=window[c[a]+"RequestAnimationFrame"];window.cancelAnimationFrame=window[c[a]+"CancelAnimationFrame"]||window[c[a]+"CancelRequestAnimationFrame"]}if(!window.requestAnimationFrame){window.requestAnimationFrame=function(h,e){var d=new Date().getTime();var f=Math.max(0,16-(d-b));var g=window.setTimeout(function(){h(d+f)},f);b=d+f;return g}}if(!window.cancelAnimationFrame){window.cancelAnimationFrame=function(d){clearTimeout(d)}}}());

/*
 * Point class
 */
var Point = (function() {
  function Point(x, y) {
    this.x = (typeof x !== 'undefined') ? x : 0;
    this.y = (typeof y !== 'undefined') ? y : 0;
  }
  Point.prototype.clone = function() {
    return new Point(this.x, this.y);
  };
  Point.prototype.length = function(length) {
    if (typeof length == 'undefined')
      return Math.sqrt(this.x * this.x + this.y * this.y);
    this.normalize();
    this.x *= length;
    this.y *= length;
    return this;
  };
  Point.prototype.normalize = function() {
    var length = this.length();
    this.x /= length;
    this.y /= length;
    return this;
  };
  return Point;
})();

/*
 * Particle class
 */
var Particle = (function() {
  function Particle() {
    this.position = new Point();
    this.velocity = new Point();
    this.acceleration = new Point();
    this.age = 0;
  }
  Particle.prototype.initialize = function(x, y, dx, dy) {
    this.position.x = x;
    this.position.y = y;
    this.velocity.x = dx;
    this.velocity.y = dy;
    this.acceleration.x = dx * settings.particles.effect;
    this.acceleration.y = dy * settings.particles.effect;
    this.age = 0;
  };
  Particle.prototype.update = function(deltaTime) {
    this.position.x += this.velocity.x * deltaTime;
    this.position.y += this.velocity.y * deltaTime;
    this.velocity.x += this.acceleration.x * deltaTime;
    this.velocity.y += this.acceleration.y * deltaTime;
    this.age += deltaTime;
  };
  Particle.prototype.draw = function(context, image) {
    function ease(t) {
      return (--t) * t * t + 1;
    }
    var size = image.width * ease(this.age / settings.particles.duration);
    context.globalAlpha = 1 - this.age / settings.particles.duration;
    context.drawImage(image, this.position.x - size / 2, this.position.y - size / 2, size, size);
  };
  return Particle;
})();

/*
 * ParticlePool class
 */
var ParticlePool = (function() {
  var particles,
      firstActive = 0,
      firstFree   = 0,
      duration    = settings.particles.duration;
  
  function ParticlePool(length) {
    // create and populate particle pool
    particles = new Array(length);
    for (var i = 0; i < particles.length; i++)
      particles[i] = new Particle();
  }
  ParticlePool.prototype.add = function(x, y, dx, dy) {
    particles[firstFree].initialize(x, y, dx, dy);
    
    // handle circular queue
    firstFree++;
    if (firstFree   == particles.length) firstFree   = 0;
    if (firstActive == firstFree       ) firstActive++;
    if (firstActive == particles.length) firstActive = 0;
  };
  ParticlePool.prototype.update = function(deltaTime) {
    var i;
    
    // update active particles
    if (firstActive < firstFree) {
      for (i = firstActive; i < firstFree; i++)
        particles[i].update(deltaTime);
    }
    if (firstFree < firstActive) {
      for (i = firstActive; i < particles.length; i++)
        particles[i].update(deltaTime);
      for (i = 0; i < firstFree; i++)
        particles[i].update(deltaTime);
    }
    
    // remove inactive particles
    while (particles[firstActive].age >= duration && firstActive != firstFree) {
      firstActive++;
      if (firstActive == particles.length) firstActive = 0;
    }
    
    
  };
  ParticlePool.prototype.draw = function(context, image) {
    // draw active particles
    if (firstActive < firstFree) {
      for (i = firstActive; i < firstFree; i++)
        particles[i].draw(context, image);
    }
    if (firstFree < firstActive) {
      for (i = firstActive; i < particles.length; i++)
        particles[i].draw(context, image);
      for (i = 0; i < firstFree; i++)
        particles[i].draw(context, image);
    }
  };
  return ParticlePool;
})();

/*
 * Putting it all together
 */
(function(canvas) {
  var context = canvas.getContext('2d'),
      particles = new ParticlePool(settings.particles.length),
      particleRate = settings.particles.length / settings.particles.duration, // particles/sec
      time;
  
  // get point on heart with -PI <= t <= PI
  function pointOnHeart(t) {
    return new Point(
      160 * Math.pow(Math.sin(t), 3),
      130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25
    );
  }
  
  // creating the particle image using a dummy canvas
  var image = (function() {
    var canvas  = document.createElement('canvas'),
        context = canvas.getContext('2d');
    canvas.width  = settings.particles.size;
    canvas.height = settings.particles.size;
    // helper function to create the path
    function to(t) {
      var point = pointOnHeart(t);
      point.x = settings.particles.size / 2 + point.x * settings.particles.size / 350;
      point.y = settings.particles.size / 2 - point.y * settings.particles.size / 350;
      return point;
    }
    // create the path
    context.beginPath();
    var t = -Math.PI;
    var point = to(t);
    context.moveTo(point.x, point.y);
    while (t < Math.PI) {
      t += 0.01; // baby steps!
      point = to(t);
      context.lineTo(point.x, point.y);
    }
    context.closePath();
    // create the fill
    context.fillStyle = '#ea80b0';
    context.fill();
    // create the image
    var image = new Image();
    image.src = canvas.toDataURL();
    return image;
  })();
  
  // render that thing!
  function render() {
    // next animation frame
    requestAnimationFrame(render);
    
    // update time
    var newTime   = new Date().getTime() / 1000,
        deltaTime = newTime - (time || newTime);
    time = newTime;
    
    // clear canvas
    context.clearRect(0, 0, canvas.width, canvas.height);
    
    // create new particles
    var amount = particleRate * deltaTime;
    for (var i = 0; i < amount; i++) {
      var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
      var dir = pos.clone().length(settings.particles.velocity);
      particles.add(canvas.width / 2 + pos.x, canvas.height / 2 - pos.y, dir.x, -dir.y);
    }
    
    // update and draw particles
    particles.update(deltaTime);
    particles.draw(context, image);
  }
  
  // handle (re-)sizing of the canvas
  function onResize() {
    canvas.width  = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.onresize = onResize;
  
  // delay rendering bootstrap
  setTimeout(function() {
    onResize();
    render();
  }, 10);
})(document.getElementById('pinkboard'));
  </script>

  <!-- DVD screensaver effect - Optimized Algorithm -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
        const overlayImg = document.getElementById('overlay-img');
        const overlay = document.getElementById('overlay');
        
        // Cache viewport dimensions for better performance
        let viewportWidth = window.innerWidth;
        let viewportHeight = window.innerHeight;
        let imgWidth = 0;
        let imgHeight = 0;
        
        // Update viewport on resize
        window.addEventListener('resize', function() {
            viewportWidth = window.innerWidth;
            viewportHeight = window.innerHeight;
        });
        
        overlayImg.onload = function() {
            // Get actual rendered dimensions
            imgWidth = overlayImg.getBoundingClientRect().width;
            imgHeight = overlayImg.getBoundingClientRect().height;
            startDVDAnimation();
        };
        
        if (overlayImg.complete) {
            // For cached images
            setTimeout(function() {
                imgWidth = overlayImg.getBoundingClientRect().width;
                imgHeight = overlayImg.getBoundingClientRect().height;
                startDVDAnimation();
            }, 10);
        }
        
        function startDVDAnimation() {
            // Calculate valid boundaries (image must stay within viewport)
            const maxX = Math.max(0, viewportWidth - imgWidth);
            const maxY = Math.max(0, viewportHeight - imgHeight);
            
            // Initialize position with safe boundaries
            let xPos = Math.random() * maxX;
            let yPos = Math.random() * maxY;
            
            // Velocity: ±2 to ±4 pixels per frame
            let xSpeed = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);
            let ySpeed = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);

            function moveImage() {
                // Recalculate boundaries (in case window resized)
                const boundaries = {
                    minX: 0,
                    maxX: Math.max(0, viewportWidth - imgWidth),
                    minY: 0,
                    maxY: Math.max(0, viewportHeight - imgHeight)
                };
                
                // Update position
                xPos += xSpeed;
                yPos += ySpeed;

                // Horizontal boundary check and bounce
                if (xPos <= boundaries.minX) {
                    xPos = boundaries.minX;
                    xSpeed = Math.abs(xSpeed); // Bounce right
                } else if (xPos >= boundaries.maxX) {
                    xPos = boundaries.maxX;
                    xSpeed = -Math.abs(xSpeed); // Bounce left
                }

                // Vertical boundary check and bounce
                if (yPos <= boundaries.minY) {
                    yPos = boundaries.minY;
                    ySpeed = Math.abs(ySpeed); // Bounce down
                } else if (yPos >= boundaries.maxY) {
                    yPos = boundaries.maxY;
                    ySpeed = -Math.abs(ySpeed); // Bounce up
                }

                // Apply new position
                overlayImg.style.left = xPos + 'px';
                overlayImg.style.top = yPos + 'px';
                overlayImg.style.margin = '0';
                overlay.style.pointerEvents = 'none';

                requestAnimationFrame(moveImage);
            }

            moveImage();
        }
    });
  </script>

  <!-- Navigation with button -->
  <script>
  (function(){
    var pages = ['index.html','index2.html','index3.html','index4.html']; // order of pages

    var overlay = document.getElementById('overlay');
    var img = document.getElementById('overlay-img');
    var txt = document.getElementById('overlay-text');
    var nextBtn = document.getElementById('nextBtn');

    // determine current file name
    var currentFile = location.pathname.split('/').pop() || 'index.html';
    var idx = pages.indexOf(currentFile);
    if (idx === -1) idx = 0;
    var nextPage = pages[(idx + 1) % pages.length];

    // allow per-page customization via data attributes on <body>
    var imgSrc = document.body.dataset.overlayImg || img.src;
    var overlayText = document.body.dataset.overlayText || txt.textContent;

    img.src = imgSrc;
    txt.textContent = overlayText;

    // Button click handler
    nextBtn.addEventListener('click', function() {
      overlay.classList.add('hidden');
      setTimeout(function(){
        window.location.href = nextPage;
      }, 1000);
    });
  })();
  </script>
